<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Audiobook Converter</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }

        progress {
            width: 100%;
            height: 20px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Audiobook Converter</h1>
        <p>Selecione um arquivo .EPUB para converter em áudio MP3.</p>

        <input type="file" id="fileInput" accept=".epub" />
        <br /><br />
        <button id="convertBtn" disabled>Converter para Audiobook</button>

        <div id="progressContainer" style="display:none; margin-top:20px;">
            <p id="statusText">Aguardando...</p>
            <progress id="progressBar" value="0" max="100"></progress>
        </div>

        <div style="margin-top:20px;">
            <a id="downloadLink" style="display:none; font-weight:bold;" download>Baixar MP3</a>
            <p id="errorText" class="error"></p>
        </div>
    </div>

    <script>const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const downloadLink = document.getElementById('downloadLink');
        const errorText = document.getElementById('errorText');

        let selectedFile = null;

        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0] ?? null;
            convertBtn.disabled = !selectedFile;
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            errorText.textContent = '';
            downloadLink.style.display = 'none';
            convertBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/api/conversions', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const { id } = await response.json();
                progressContainer.style.display = 'block';
                pollStatus(id);
            } catch (err) {
                errorText.textContent = 'Erro ao enviar arquivo: ' + err.message;
                convertBtn.disabled = false;
            }
        });

        function pollStatus(id) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/conversions/${id}`);
                    const data = await response.json();

                    statusText.textContent = `Status: ${data.status} (${data.progress}%)`;
                    progressBar.value = data.progress;

                    if (data.status === 'Completed') {
                        clearInterval(interval);
                        statusText.textContent = 'Conversão concluída!';
                        downloadLink.href = data.downloadUrl;
                        downloadLink.style.display = 'inline';
                        downloadLink.textContent = 'Baixar Audiobook MP3';
                        convertBtn.disabled = false;
                    }

                    if (data.status === 'Failed') {
                        clearInterval(interval);
                        errorText.textContent = 'Falha na conversão: ' + (data.errorMessage ?? 'Erro desconhecido');
                        convertBtn.disabled = false;
                    }
                } catch (e) {
                    console.error("Erro no polling: ", e);
                }
            }, 2000);
        }</script>
</body>
</html>
